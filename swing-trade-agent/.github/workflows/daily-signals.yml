name: Daily Swing Signals

# Runs once daily after the US market close. Regular US close is 20:00 UTC
# (16:00 ET); 22:30 UTC leaves a comfortable margin year-round (DST + late
# data settling). Adjust as needed.
on:
  schedule:
    - cron: "30 22 * * 1-5" # Mon-Fri, 22:30 UTC
  workflow_dispatch: {} # allow manual runs

# The pipeline is read-only and never places trades.
permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swing-trade-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (fail fast before spending API calls)
        run: python -m pytest -q

      - name: Run daily pipeline
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_BASE_URL: ${{ secrets.T212_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SIGNAL_THRESHOLD: ${{ vars.SIGNAL_THRESHOLD }}
        run: python -m app.run run --html --out digest.html

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-signal-digest
          path: swing-trade-agent/digest.html
          if-no-files-found: ignore
